# Checks every push and pull request: formatting, lints and all tests, on
# Windows (the real target), Linux and macOS (released but untested on
# hardware; CI at least keeps them building and passing the tests).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Pinned so a new Rust release (and its new clippy lints) can't break
      # CI overnight. To upgrade: change it here and in release.yml, then fix
      # whatever `cargo clippy` reports.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt

      - name: Linux libraries (window, Bluetooth)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      # The app embeds the PDF renderer at build time (crates/label-printer/build.rs),
      # so it must be present before anything compiles.
      - name: Fetch pdfium (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1

      - name: Fetch pdfium (Linux, macOS)
        if: runner.os != 'Windows'
        run: bash scripts/fetch-pdfium.sh

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all
